# Continuous delivery. After CI passes on main:
#   1. build and push ghcr.io/c0de-ch/dia-storage:sha-<short> (and :latest)
#   2. publish the Helm chart to oci://ghcr.io/c0de-ch/charts if its version is new
#   3. push a branch to lab-k8s01-gitops that sets the new image tag; a workflow
#      there opens the pull request. Merging it deploys to k8s01 via Argo CD.
# A v* tag only builds and pushes the semver image tags.
#
# Needs the repository secret GITOPS_DEPLOY_KEY: the private half of a deploy
# key with write access on lab-k8s01-gitops ("dia-storage CD").
name: Publish & Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

# One publish at a time per ref: a newer run on main cancels an older one
# still building, so an older image can never reach the gitops repo after a
# newer one (its deploy PR would close the newer PR as "replaced").
concurrency:
  group: publish-${{ github.event_name == 'push' && github.ref || 'main' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_PATH: deploy/helm/dia-storage
  CHART_REPO: oci://ghcr.io/c0de-ch/charts
  GITOPS_REPO: c0de-ch/lab-k8s01-gitops
  GITOPS_VALUES: apps/dia-storage/values.yaml
  GITOPS_APPLICATION: applications/dia-storage.yaml

jobs:
  image:
    name: Build & Push Image
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute tag
        id: tag
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${sha::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=${{ steps.tag.outputs.tag }}
            # semver tags: v1.2.3 -> 1.2.3, 1.2, 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=dia-storage
            org.opencontainers.image.description=Family archive of scanned 35mm slides

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # k8s01 runs amd64 workers; sharp and bcrypt bring native code, so
          # an arm64 build under QEMU would take most of an hour for nothing.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ steps.tag.outputs.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  chart:
    name: Publish Helm Chart
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/setup-helm@v5

      - name: Login to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart if this version is new
        id: version
        run: |
          version=$(helm show chart "$CHART_PATH" | awk '/^version:/ {print $2}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if helm show chart "$CHART_REPO/dia-storage" --version "$version" >/dev/null 2>&1; then
            echo "Chart $version already published"
          else
            helm lint "$CHART_PATH" -f "$CHART_PATH/ci/test-values.yaml"
            helm package "$CHART_PATH" -d dist
            helm push "dist/dia-storage-$version.tgz" "$CHART_REPO"
          fi

  deploy:
    name: Propose Deploy to k8s01
    needs: [image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip unless this is still the head of main
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::main moved on to $head; the newer run deploys instead"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gitops repo
        if: steps.latest.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Push a branch with the new image tag
        if: steps.latest.outputs.skip != 'true'
        working-directory: gitops
        env:
          TAG: ${{ needs.image.outputs.tag }}
          CHART_VERSION: ${{ needs.chart.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          if [ ! -f "$GITOPS_VALUES" ]; then
            echo "::warning::$GITOPS_VALUES not found in $GITOPS_REPO; skipping deploy"
            exit 0
          fi
          # sed rather than yq: yq drops blank lines and would reformat the
          # files in every deploy PR.
          sed -i -E "s/^(  tag: ).*/\1$TAG/" "$GITOPS_VALUES"
          # Only the chart source has a numeric targetRevision (the git one is main).
          sed -i -E "s/^(      targetRevision: )[0-9]+\.[0-9]+\.[0-9]+.*$/\1$CHART_VERSION/" \
            "$GITOPS_APPLICATION"
          if git diff --quiet; then
            echo "Nothing to deploy: $TAG is already set"
            exit 0
          fi
          git config user.name "dia-storage CD"
          git config user.email "actions@github.com"
          branch="deploy/dia-storage-$TAG"
          git checkout -b "$branch"
          git commit -am "Deploy dia-storage $TAG" \
            -m "$TITLE" \
            -m "https://github.com/${{ github.repository }}/commit/$SHA"
          git push --force origin "$branch"
