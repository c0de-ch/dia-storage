apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dia-storage.fullname" . }}
  labels:
    {{- include "dia-storage.labels" . | nindent 4 }}
data:
  # Read by src/lib/config/loader.ts (CONFIG_PATH). DIA_* variables override it.
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
