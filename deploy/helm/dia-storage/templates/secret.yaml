{{- if and (not .Values.secrets.existingSecret) .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dia-storage.secretName" . }}
  labels:
    {{- include "dia-storage.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.create }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
